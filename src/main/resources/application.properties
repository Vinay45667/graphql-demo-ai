spring.application.name=demo

# --- H2 in-memory database ---
spring.datasource.url=jdbc:h2:mem:booksdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- GraphQL ---
# Enables the GraphiQL playground UI at /graphiql
spring.graphql.graphiql.enabled=true

# --- Spring AI (OpenAI-compatible) ---
# The key defaults to "not-set" so the app still builds, tests, and boots
# without a real key. Set OPENAI_API_KEY to enable the AI query at runtime.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
# Default endpoint is OpenAI. To use a free OpenAI-compatible provider like
# Groq, set AI_BASE_URL=https://api.groq.com/openai and pick a Groq model.
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com}
